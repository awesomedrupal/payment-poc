services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: pay
      POSTGRES_PASSWORD: pay
      POSTGRES_DB: paydb
    ports:
      - "5432:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pay -d paydb"]
      interval: 3s
      timeout: 3s
      retries: 20

  kafka:
      image: apache/kafka:3.7.0
      container_name: kafka
      ports:
        - "9092:9092"
        - "29092:29092"
      environment:
        # KRaft single-node combined mode
        KAFKA_NODE_ID: 1
        KAFKA_PROCESS_ROLES: "broker,controller"
        KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
        KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"

        # Listeners: one for internal docker network, one for host access
        KAFKA_LISTENERS: "PLAINTEXT://kafka:9092,PLAINTEXT_HOST://0.0.0.0:29092,CONTROLLER://kafka:9093"
        KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092"
        KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT"
        KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"

        # Single-node safety
        KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
        KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
        KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

        # Convenience
        KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
        KAFKA_NUM_PARTITIONS: 6
      healthcheck:
        test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list >/dev/null 2>&1 || exit 1"]
        interval: 5s
        timeout: 5s
        retries: 30

  api:
    build: ./app
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://pay:pay@postgres:5432/paydb
      KAFKA_BROKERS: kafka:9092
      PAYMENTS_TOPIC: payments.events
      PROCESSOR_WEBHOOK_SECRET: processor_webhook_secret_dev
      SERVICE_BASE_URL: http://api:3000
      NONCE_TTL_SECONDS: 600
      HMAC_SKEW_SECONDS: 300
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    command: ["node", "src/api.js"]

  outbox_publisher:
    build: ./app
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://pay:pay@postgres:5432/paydb
      KAFKA_BROKERS: kafka:9092
      PAYMENTS_TOPIC: payments.events
      OUTBOX_POLL_MS: 250
      OUTBOX_BATCH_SIZE: 200
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    command: ["node", "src/outbox_publisher.js"]

  orchestrator:
    build: ./app
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://pay:pay@postgres:5432/paydb
      KAFKA_BROKERS: kafka:9092
      PAYMENTS_TOPIC: payments.events
      FAKE_PROCESSOR_URL: http://fake_processor:4000
      SERVICE_BASE_URL: http://api:3000
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka_init:
        condition: service_completed_successfully
      fake_processor:
        condition: service_started
    command: ["node", "src/orchestrator.js"]

  fake_processor:
    build: ./app
    environment:
      NODE_ENV: production
      PORT: 4000
      PROCESSOR_WEBHOOK_SECRET: processor_webhook_secret_dev
      WEBHOOK_TARGET_URL: http://api:3000/webhooks/gateway
      DEFAULT_OUTCOME: succeed
    ports:
      - "4000:4000"
    command: ["node", "src/fake_processor.js"]

  reconciler:
    build: ./app
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://pay:pay@postgres:5432/paydb
      FAKE_PROCESSOR_URL: http://fake_processor:4000
      RECONCILE_EVERY_MS: 5000
    depends_on:
      postgres:
        condition: service_healthy
      fake_processor:
        condition: service_started
    command: ["node", "src/reconciler.js"]

  kafka_init:
    image: apache/kafka:3.7.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-lc"]
    command: >
      "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092
      --create --if-not-exists
      --topic payments.events
      --partitions 6
      --replication-factor 1
      && echo 'kafka_init: topic ensured'
      "
